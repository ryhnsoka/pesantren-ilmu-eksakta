{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl md:text-4xl font-bold font-serif-display text-gray-900 mb-2 text-center">{{ .Title }}</h1>
    
    <p class="text-center text-gray-500 mb-8">
        {{ with .Params.author }}
            <span class="font-semibold">{{ . }}</span> | 
        {{ end }}
        <span>Dipublikasikan pada {{ .Date.Format "2 January 2006" }}</span>
        {{ with .Params.categories }}
            | <span>Kategori: <a href="{{ "/categories/" | relURL }}{{ index . 0 | urlize }}" class="text-orange-600 hover:underline">{{ index . 0 }}</a></span>
        {{ end }}
    </p>
    
    <!-- ================= TOMBOL BAGIKAN DI HEADER ARTIKEL ================= -->
    <div class="flex flex-wrap items-center gap-2 my-4 pb-4 border-b border-gray-100 not-prose">
      <span class="text-xs text-gray-500 font-medium mr-1">Bagikan:</span>
      
      <!-- Tombol Share Native (HP) -->
      <button id="btnNativeShare" 
              class="inline-flex items-center gap-1.5 bg-orange-600 hover:bg-orange-700 text-white font-medium text-xs px-3 py-1.5 rounded shadow-sm transition-all">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
        </svg>
        Bagikan
      </button>

      <!-- Tombol WhatsApp -->
      <a href="https://api.whatsapp.com/send?text={{ .Title | urlquery }}%0A%0A{{ .Permalink | urlquery }}" 
         target="_blank" rel="noopener noreferrer" 
         class="inline-flex items-center gap-1.5 bg-[#25D366] hover:bg-[#20ba5a] text-white font-medium text-xs px-3 py-1.5 rounded shadow-sm transition-all">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
        </svg>
        WhatsApp
      </a>

      <!-- Tombol Salin Tautan -->
      <button id="btnCopyLink" 
              class="inline-flex items-center gap-1.5 bg-gray-50 hover:bg-gray-100 text-gray-700 font-medium text-xs px-3 py-1.5 rounded border border-gray-200 transition-all">
        <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        <span id="copyText">Salin</span>
      </button>
    </div>

    <article class="prose prose-lg max-w-none text-justify">
        {{ .Content }}
    </article>
</div>

<!-- Letakkan script logika di bagian paling bawah file (cukup sekali saja) -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const pageTitle = {{ .Title | jsonify }};
    const pageUrl = window.location.href;

    const btnShare = document.getElementById('btnNativeShare');
    const btnCopy = document.getElementById('btnCopyLink');
    const copyText = document.getElementById('copyText');

    if (btnShare) {
        btnShare.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({ title: pageTitle, text: pageTitle, url: pageUrl });
                } catch (err) {
                    if (err.name !== 'AbortError') console.error(err);
                }
            } else {
                copyUrlToClipboard();
            }
        });
    }

    if (btnCopy) {
        btnCopy.addEventListener('click', copyUrlToClipboard);
    }

    function copyUrlToClipboard() {
        navigator.clipboard.writeText(pageUrl).then(() => {
            if (copyText) copyText.textContent = '✓ Tersalin!';
            if (btnCopy) btnCopy.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
            setTimeout(() => {
                if (copyText) copyText.textContent = 'Salin';
                if (btnCopy) btnCopy.classList.remove('bg-green-50', 'text-green-700', 'border-green-200');
            }, 2000);
        }).catch(err => console.error('Gagal menyalin:', err));
    }
});
</script>
{{ end }}
